[package]
name = "dshh"
version = "1.3.4"
description = "Multi-protocol connection client"
authors = ["you"]
edition = "2021"

[lib]
name = "dshh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1.0.103"
arboard = { version = "3.6.1", default-features = false }
argon2 = "0.5"
base64 = "0.22"
async-trait = "0.1.89"
des = "0.9"
flate2 = "1"
getrandom = "0.3"
md5 = "0.8"
num-bigint = "0.4"
portable-pty = "0.9.0"
russh = { version = "0.61.2", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serialport = "4.9.0"
sha1 = "0.11"
suppaftp = { version = "10.0.0", features = ["native-tls"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tokio = { version = "1.52.3", features = ["full"] }
tokio-native-tls = "0.3"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
# A paused clock for the VNC keepalive test.
tokio = { version = "1.52.3", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
# Relays a forwarded agent to PuTTY's Pageant (already in the tree via russh).
pageant = "0.2"
# Windows' own OCR engine, for reading text off a VNC screen (the same
# version webview2-com already pulls in).
windows = { version = "0.61", features = [
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }
